version: '3.8'

services:
  discord-dpi-bypass:
    build:
      context: .
      dockerfile: Dockerfile
    image: cnek00/discord-dpi-bypass:latest
    container_name: discord_dpi_bypass
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "40000:40000"
    environment:
      - PROXY_PORT=8080
      - DNS_MODE=doh
      - DNS_ADDR=1.1.1.1
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
