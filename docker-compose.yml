services:
  spoofdpi:
    build:
      context: .
      dockerfile: Dockerfile
    image: spoofdpi-macos:local
    container_name: spoofdpi_macos
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PROXY_PORT=8080
      - DNS_MODE=https
      - DNS_HTTPS_URL=https://cloudflare-dns.com/dns-query
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
